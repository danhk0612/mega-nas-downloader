services:
  mega-downloader:
    image: ghcr.io/danhk0612/mega-nas-downloader:1.0.0
    container_name: mega-downloader
    restart: unless-stopped
    ports:
      - "3010:3000"
    environment:
      TZ: Asia/Seoul
      APP_PORT: 3000
      DOWNLOAD_DIR: /downloads
      DATA_DIR: /data
      TEMP_DIR: /data/temp
      MAX_CONCURRENT_DOWNLOADS: 2
      MAX_VISIBLE_JOBS: 500
      AUTO_START_PENDING: "true"
      RETRY_ON_STARTUP: "false"
      MAX_RETRY_COUNT: 3
      POLL_INTERVAL_MS: 1000
      DEFAULT_DUPLICATE_POLICY: rename
      APP_USERNAME: ""
      APP_PASSWORD: ""
      LOG_LEVEL: info
      PUID: 1026
      PGID: 100
      UMASK: "022"
    volumes:
      - /volume1/Download/_mega/file:/downloads
      - /volume1/Download/_mega/data:/data
